plugins {
	id 'java-library'
	id 'org.jetbrains.kotlin.jvm'
	id 'org.jetbrains.kotlin.plugin.serialization'
}

group = rootProject.group
version = rootProject.version

repositories {
	mavenCentral()
}

dependencies {
	api project(':authoring-sdk')
	implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:${project.coroutines_version}"
	implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:${project.serialization_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

kotlin {
	compilerOptions {
		jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
		javaParameters = true
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 21
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	dependsOn ':draw-worker:runtimeBundle'
	systemProperty 'worldsmith.workerRuntime', rootProject.file('draw-worker/build/runtime').absolutePath
	systemProperty 'worldsmith.projectRoot', rootProject.projectDir.absolutePath
	if (project.hasProperty('java26Home')) systemProperty 'worldsmith.java26Home', project.property('java26Home')
}

tasks.register('hashPack', JavaExec) {
	group = 'worldsmith'
	description = 'Prints the generation-content SHA-256 for a Worldsmith Pack directory.'
	dependsOn classes
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.wjz.worldsmith.core.hash.WorldsmithHashCli'
	args((findProperty('packDir') ?: file('src/main/resources/worldsmith/packs/ashlands').absolutePath))
}

tasks.register('creatureAuthoring', JavaExec) {
	group = 'worldsmith'
	description = 'Compile one local creature recipe or Java builder example and export its fixed UV guide and current runtime definition.'
	dependsOn classes
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.wjz.worldsmith.core.creatureauthoring.CreatureAuthoringCli'
	def workspace = projectDir.parentFile
	args((findProperty('recipeFile') ?: new File(workspace, 'docs/examples/creature-authoring/DarkstarGatekeeper.java').absolutePath).toString(),
		(findProperty('outputDir') ?: new File(workspace, 'build/creature-authoring/darkstar-gatekeeper').absolutePath).toString())
	if (findProperty('textureFile')) args(findProperty('textureFile').toString())
}

tasks.register('previewStructure', JavaExec) {
	group = 'worldsmith'
	description = 'Compile a structure blueprint into an SVG schematic without Minecraft.'
	dependsOn classes
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.wjz.worldsmith.core.structure.StructurePreviewCli'
	workingDir rootProject.projectDir
	args((findProperty('blueprintFile') ?: file('src/main/resources/worldsmith/structures/forest_shrine.json').absolutePath),
		(findProperty('previewFile') ?: rootProject.file('build/structure-previews/forest_shrine.svg').absolutePath),
		(findProperty('sliceY') ?: ''), (findProperty('cutaway') ?: 'false'),
		(findProperty('variant') ?: '0'), (findProperty('assembly') ?: 'false'))
}

tasks.register('previewCreature', JavaExec) {
	group = 'worldsmith'
	description = 'Render a verified creature PNG atlas on its actual cuboid model with shared runtime poses, offline.'
	dependsOn classes
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.wjz.worldsmith.core.content.CreaturePreviewCli'
	def workspace = projectDir.parentFile
	def authoring = new File(workspace, 'build/creature-authoring/darkstar-gatekeeper')
	args((findProperty('creatureFile') ?: new File(authoring, 'creature.json').absolutePath).toString(),
		(findProperty('textureFile') ?: new File(authoring, 'texture.png').absolutePath).toString(),
		(findProperty('previewDir') ?: new File(authoring, 'previews').absolutePath).toString())
}

tasks.register('drawGallery', JavaExec) {
	group = 'worldsmith'
	description = 'Run the pure-Java drawing SDK example without Minecraft or Python.'
	dependsOn classes
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.wjz.worldsmith.core.draw.examples.DrawGallery'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// Compile the Java-only draw API independently of Kotlin. authoring-sdk depends
// on this API and Core consumes authoring-sdk, so using compileJava creates a cycle.
tasks.register('compileDrawApi', JavaCompile) {
	source fileTree('src/main/java') { include 'com/wjz/worldsmith/core/draw/**' }
	classpath = files()
	destinationDirectory = layout.buildDirectory.dir('classes/draw-api')
	options.release = 21
}
tasks.register('drawSdkJar', Jar) {
	archiveClassifier = 'draw-sdk'
	dependsOn compileDrawApi
	from(layout.buildDirectory.dir('classes/draw-api'))
}
