plugins { id 'java' }
evaluationDependsOn(':core')

repositories { mavenCentral() }
configurations { compilerRuntime }
dependencies {
	implementation files(rootProject.project(':core').tasks.named('drawSdkJar'))
	implementation project(':authoring-sdk')
	implementation 'org.eclipse.jdt:ecj:3.46.0'
	compilerRuntime 'org.eclipse.jdt:ecj:3.46.0'
}
tasks.withType(JavaCompile).configureEach { options.release = 21 }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }

tasks.register('runtimeBundle', Sync) {
	dependsOn jar, project(':core').tasks.named('drawSdkJar')
	into layout.buildDirectory.dir('runtime')
	from(tasks.named('jar')) { rename { 'draw-worker.jar' } }
	from(project(':core').tasks.named('drawSdkJar')) { rename { 'draw-sdk.jar' } }
	from(project(':authoring-sdk').tasks.named('jar')) { rename { 'authoring-sdk.jar' } }
	from(configurations.compilerRuntime) { rename { 'ecj.jar' } }
}
